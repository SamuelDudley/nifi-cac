[project]
name = "nificac"
version = "0.1.0"
description = "Configuration as Code for Apache NiFi 2.x"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nificac = "nificac.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nificac"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
